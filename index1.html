<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10131a"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>2画像調整</title><style>:root{--blue:#3d91ff;--panel:#1b202b}*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#090b10;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;-webkit-tap-highlight-color:transparent}#stage{width:100vw;height:100dvh;position:relative;overflow:hidden;touch-action:none;background-color:#090b10;background-image:linear-gradient(45deg,#151a25 25%,transparent 25%),linear-gradient(-45deg,#151a25 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#151a25 75%),linear-gradient(-45deg,transparent 75%,#151a25 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}.layer{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform-origin:center;pointer-events:none}.selected{filter:drop-shadow(0 0 3px #fff) drop-shadow(0 0 8px var(--blue))}#lasso{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.top{position:absolute;top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;z-index:3}.tabs,.icons{display:flex;gap:7px}.tab,.icon{border:0;color:#fff;background:#19202ccc;border:1px solid #ffffff35;border-radius:12px;min-height:40px;font:600 14px -apple-system;backdrop-filter:blur(10px)}.tab{padding:0 13px}.tab.active,.icon.active{background:var(--blue);border-color:#a8d0ff}.icon{width:40px;font-size:19px}.empty,.guide{position:absolute;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none}.empty{top:50%;translate:-50% -50%;color:#8c98a9;line-height:1.6}.guide{bottom:calc(14px + env(safe-area-inset-bottom));background:#000a;border-radius:10px;padding:8px 12px;font-size:12px;color:#e3efff;max-width:calc(100% - 28px)}#sheet{position:absolute;z-index:4;left:0;right:0;bottom:0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));border-radius:22px 22px 0 0;background:var(--panel);box-shadow:0 -6px 24px #0008;transform:translateY(110%);transition:.22s}.show{transform:translateY(0)!important}.sheetHead{display:flex;justify-content:space-between;align-items:center;font-size:17px;font-weight:700}.close{border:0;border-radius:50%;width:32px;height:32px;color:#fff;background:#343e50;font-size:20px}.row{margin-top:15px}.lab{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px;color:#eef4ff}output{color:#afc1d9;font-variant-numeric:tabular-nums}input{width:100%;accent-color:var(--blue);min-height:32px}#notice{position:absolute;z-index:6;left:50%;bottom:calc(65px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#000c;border-radius:9px;padding:8px 11px;font-size:12px;white-space:nowrap;opacity:0;pointer-events:none;transition:.2s}.notice{opacity:1!important}</style></head><body><div id="stage"><img id="image1" class="layer" alt=""><img id="image2" class="layer" alt=""><canvas id="lasso"></canvas><div id="empty" class="empty">画像1または画像2を選び、<br>右上の写真アイコンから読み込んでください</div><div class="top"><div class="tabs"><button class="tab" id="tab1">画像1</button><button class="tab" id="tab2">画像2</button></div><div class="icons"><button class="icon" id="add" title="画像を追加・入替" aria-label="画像を追加・入替">▧</button><button class="icon" id="adjust" title="調整" aria-label="調整">☷</button><button class="icon" id="crop" title="切り取り" aria-label="切り取り">✂</button><button class="icon" id="restore" title="切り取りを元に戻す" aria-label="切り取りを元に戻す">↶</button><button class="icon" id="save" title="保存" aria-label="保存">⇩</button></div></div><div id="guide" class="guide">画像をタップして選択してください</div></div><input id="file" type="file" accept="image/*" hidden><div id="sheet"><div class="sheetHead"><span id="sheetTitle">画像を調整</span><button class="close" id="close">×</button></div><div class="row"><div class="lab"><span>拡大縮小</span><output id="scaleOut"></output></div><input id="scale" type="range" min="10" max="300" value="100"></div><div class="row"><div class="lab"><span>回転</span><output id="rotateOut"></output></div><input id="rotate" type="range" min="-180" max="180" value="0"></div><div class="row"><div class="lab"><span>透明度</span><output id="opacityOut"></output></div><input id="opacity" type="range" min="0" max="100" value="100"></div></div><div id="notice"></div><script>const $=x=>document.getElementById(x),stage=$('stage'),lc=$('lasso').getContext('2d'),S={1:{original:null,im:null,url:null,scale:100,rotate:0,opacity:100,x:0,y:0},2:{original:null,im:null,url:null,scale:100,rotate:0,opacity:100,x:0,y:0}};let active=null,cut=false,pts=[],pointers=new Map(),op=null,timer;
function msg(s){$('notice').textContent=s;$('notice').classList.add('notice');clearTimeout(timer);timer=setTimeout(()=>$('notice').classList.remove('notice'),2200)}function dim(s){let k=Math.min(stage.clientWidth/s.im.naturalWidth,stage.clientHeight/s.im.naturalHeight);return{w:s.im.naturalWidth*k,h:s.im.naturalHeight*k,k}}function render(n){let s=S[n],p=$('image'+n);if(s.im)p.src=s.im===s.original?s.url:s.im.src;p.style.transform=`translate(${s.x}px,${s.y}px) scale(${s.scale/100}) rotate(${s.rotate}deg)`;p.style.opacity=s.opacity/100;p.classList.toggle('selected',active===n);$('tab'+n).classList.toggle('active',active===n);$('empty').style.display=(S[1].im||S[2].im)?'none':'grid'}function guide(){let t=active?`画像${active}を選択中：1本指で移動、2本指で拡大縮小・回転`:'画像をタップして選択してください';if(active&&cut)t=`画像${active}を切り取り中：消したい部分を囲んでください`;$('guide').textContent=t;$('crop').classList.toggle('active',cut)}function select(n){active=n;cut=false;[1,2].forEach(render);guide()}function point(e){let r=stage.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function source(n,p){let s=S[n],b=dim(s),cx=stage.clientWidth/2+s.x,cy=stage.clientHeight/2+s.y,a=-s.rotate*Math.PI/180,dx=p.x-cx,dy=p.y-cy,rx=(dx*Math.cos(a)-dy*Math.sin(a))/(s.scale/100),ry=(dx*Math.sin(a)+dy*Math.cos(a))/(s.scale/100);return{x:(rx+b.w/2)/b.k,y:(ry+b.h/2)/b.k}}function hit(n,p){if(!S[n].im)return false;let q=source(n,p),s=S[n];return q.x>=0&&q.x<=s.im.naturalWidth&&q.y>=0&&q.y<=s.im.naturalHeight}function hitTop(p){return hit(2,p)?2:hit(1,p)?1:null}function path(){let c=$('lasso');c.width=stage.clientWidth;c.height=stage.clientHeight;if(pts.length<2)return;lc.strokeStyle='#fff';lc.lineWidth=2;lc.setLineDash([5,4]);lc.beginPath();lc.moveTo(pts[0].x,pts[0].y);pts.slice(1).forEach(p=>lc.lineTo(p.x,p.y));lc.stroke();lc.setLineDash([])}function erase(){if(!active||pts.length<3)return;let s=S[active],c=document.createElement('canvas'),x=c.getContext('2d');c.width=s.im.naturalWidth;c.height=s.im.naturalHeight;x.drawImage(s.im,0,0);let a=pts.map(p=>source(active,p));x.beginPath();x.moveTo(a[0].x,a[0].y);a.slice(1).forEach(p=>x.lineTo(p.x,p.y));x.closePath();x.globalCompositeOperation='destination-out';x.fill();let im=new Image();im.onload=()=>{s.im=im;pts=[];path();render(active);msg('囲んだ部分を透明にしました。')};im.src=c.toDataURL()}function pair(){let a=[...pointers.values()];if(a.length!==2)return;let dx=a[1].x-a[0].x,dy=a[1].y-a[0].y;return{d:Math.hypot(dx,dy),a:Math.atan2(dy,dx)}}function begin(){let q=pair();if(active&&q)op={...q,scale:S[active].scale,rotate:S[active].rotate}}
stage.onpointerdown=e=>{stage.setPointerCapture(e.pointerId);let p=point(e);pointers.set(e.pointerId,p);if(pointers.size===2){pts=[];path();begin();return}let n=hitTop(p);if(!n){active=null;cut=false;[1,2].forEach(render);guide();return}if(n!==active)select(n);if(cut)pts=[p];else op={drag:true,id:e.pointerId,p,x:S[active].x,y:S[active].y}};stage.onpointermove=e=>{if(!pointers.has(e.pointerId))return;let p=point(e);pointers.set(e.pointerId,p);if(pointers.size===2&&active){let q=pair();if(!op||!op.d)begin();if(q&&op){S[active].scale=Math.max(10,Math.min(300,op.scale*q.d/op.d));S[active].rotate=op.rotate+(q.a-op.a)*180/Math.PI;render(active)}return}if(!active)return;if(cut&&pts.length){pts.push(p);path()}else if(op?.drag&&op.id===e.pointerId){S[active].x=op.x+p.x-op.p.x;S[active].y=op.y+p.y-op.p.y;render(active)}};function end(e){let doErase=cut&&pointers.size===1&&pts.length>2;pointers.delete(e.pointerId);if(doErase)erase();if(pointers.size<2)op=null}stage.onpointerup=end;stage.onpointercancel=end;
$('tab1').onclick=()=>select(1);$('tab2').onclick=()=>select(2);$('add').onclick=()=>active?$('file').click():msg('先に画像1または画像2を選んでください。');$('file').onchange=e=>{let f=e.target.files[0];if(!f||!active)return;if(S[active].url)URL.revokeObjectURL(S[active].url);let u=URL.createObjectURL(f),im=new Image();im.onload=()=>{Object.assign(S[active],{original:im,im,url:u,scale:100,rotate:0,opacity:100,x:0,y:0});render(active);guide()};im.src=u};$('adjust').onclick=()=>{if(!active)return msg('先に画像を選んでください。');let s=S[active];$('sheetTitle').textContent=`画像${active}を調整`;$('scale').value=s.scale;$('rotate').value=s.rotate;$('opacity').value=s.opacity;updateOut();$('sheet').classList.add('show')};$('close').onclick=()=>$('sheet').classList.remove('show');function updateOut(){$('scaleOut').value=(+$('scale').value/100).toFixed(2)+' 倍';$('rotateOut').value=$('rotate').value+'°';$('opacityOut').value=$('opacity').value+'%'};['scale','rotate','opacity'].forEach(k=>$(k).oninput=e=>{if(!active)return;S[active][k]=+e.target.value;updateOut();render(active)});$('crop').onclick=()=>{if(!active)return msg('先に画像を選んでください。');cut=!cut;guide()};$('restore').onclick=()=>{if(!active||!S[active].original)return msg('先に画像を選んでください。');S[active].im=S[active].original;render(active);msg('切り取りを元に戻しました。')};$('save').onclick=async()=>{if(!S[1].im&&!S[2].im)return msg('先に画像を読み込んでください。');let r=2000/stage.clientWidth,c=document.createElement('canvas'),x=c.getContext('2d');c.width=c.height=2000;x.fillStyle='#090b10';x.fillRect(0,0,2000,2000);[1,2].forEach(n=>{let s=S[n];if(!s.im)return;let z=Math.min(2000/s.im.naturalWidth,2000/s.im.naturalHeight)*s.scale/100,w=s.im.naturalWidth*z,h=s.im.naturalHeight*z;x.save();x.translate(1000+s.x*r,1000+s.y*r);x.rotate(s.rotate*Math.PI/180);x.globalAlpha=s.opacity/100;x.drawImage(s.im,-w/2,-h/2,w,h);x.restore()});let b=await new Promise(q=>c.toBlob(q,'image/png')),f=new File([b],'two-image-'+Date.now()+'.png',{type:'image/png'});try{if(navigator.canShare?.({files:[f]}))await navigator.share({files:[f],title:'合成画像'});else{let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=f.name;a.click()}}catch(_){}};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');[1,2].forEach(render);guide();</script></body></html>
