<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10131a">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>2画像調整</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10131a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}#stage{position:fixed;inset:0;overflow:hidden;touch-action:none;background:#090b10;background-image:linear-gradient(45deg,#171d29 25%,transparent 25%),linear-gradient(-45deg,#171d29 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#171d29 75%),linear-gradient(-45deg,transparent 75%,#171d29 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}.image{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;transform-origin:center}.selected{filter:drop-shadow(0 0 3px #fff) drop-shadow(0 0 8px #3d91ff)}#trace{position:absolute;inset:0;pointer-events:none}.top{position:absolute;z-index:5;top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between;gap:8px}.group{display:flex;gap:6px}.top button,.sheet button{border:0;background:#202838e8;color:#fff;font:600 14px -apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}.tab{min-width:64px;height:36px;border-radius:10px}.tool{width:36px;height:36px;border-radius:50%;font-size:18px!important}.active{background:#3d91ff!important}.mode{outline:2px solid #9dccff}.empty{position:absolute;inset:0;display:grid;place-items:center;color:#9aa6b8;text-align:center;line-height:1.6;pointer-events:none}.hint{position:absolute;z-index:3;bottom:calc(14px + env(safe-area-inset-bottom));left:14px;right:14px;border-radius:9px;padding:7px 10px;text-align:center;background:#000a;color:#dde9ff;font-size:12px;pointer-events:none}.sheet{position:fixed;z-index:8;left:0;right:0;bottom:0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));background:#1b202b;border-top:1px solid #374154;border-radius:20px 20px 0 0;transform:translateY(110%);transition:transform .2s}.sheet.open{transform:none}.sheethead{display:flex;align-items:center;justify-content:space-between;font-weight:700}.sheethead button{height:34px;padding:0 12px;border-radius:9px}.row{margin-top:14px}.row div{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}.row output{color:#bdc9da}input[type=range]{display:block;width:100%;accent-color:#3d91ff;min-height:34px}
</style></head><body>
<div id="stage"><div id="empty" class="empty">右上の ＋ を押して<br>画像を読み込んでください</div><img id="view1" class="image"><img id="view2" class="image"><canvas id="trace"></canvas><div class="top"><div class="group"><button id="tab1" class="tab">画像1</button><button id="tab2" class="tab">画像2</button></div><div class="group"><button id="add" class="tool" title="画像を追加・入替">＋</button><button id="adjust" class="tool" title="調整">☷</button><button id="cut" class="tool" title="消去カット">✂</button><button id="restore" class="tool" title="カットを復元">↶</button><button id="save" class="tool" title="保存">⇩</button></div></div><div id="hint" class="hint">画像をタップして選択してください</div></div>
<input id="picker" type="file" accept="image/*" hidden>
<section id="sheet" class="sheet"><div class="sheethead"><span id="sheetTitle">画像の調整</span><button id="close">閉じる</button></div><div class="row"><div><span>拡大縮小</span><output id="scaleOut"></output></div><input id="scale" type="range" min="10" max="300"></div><div class="row"><div><span>回転</span><output id="rotateOut"></output></div><input id="rotate" type="range" min="-180" max="180"></div><div class="row"><div><span>透明度</span><output id="opacityOut"></output></div><input id="opacity" type="range" min="0" max="100"></div></section>
<script>
const $=id=>document.getElementById(id),stage=$("stage"),trace=$("trace"),tc=trace.getContext("2d");
const layers={1:{canvas:null,original:null,url:null,scale:100,rotate:0,opacity:100,x:0,y:0},2:{canvas:null,original:null,url:null,scale:100,rotate:0,opacity:100,x:0,y:0}};
let selected=0,cutMode=false,points=[],pointers=new Map(),gesture=null,lastTap={time:0,layer:0};
const canvasFromImage=im=>{const c=document.createElement("canvas");c.width=im.naturalWidth;c.height=im.naturalHeight;c.getContext("2d").drawImage(im,0,0);return c};
function render(n,refresh=false){const L=layers[n],v=$("view"+n);if(L.canvas&&refresh)v.src=L.canvas.toDataURL("image/png");v.style.transform=`translate(${L.x}px,${L.y}px) scale(${L.scale/100}) rotate(${L.rotate}deg)`;v.style.opacity=L.opacity/100;v.classList.toggle("selected",selected===n);$("tab"+n).classList.toggle("active",selected===n);$("empty").style.display=(layers[1].canvas||layers[2].canvas)?"none":"grid"}
function message(text){$("hint").textContent=text}
function select(n){selected=n;render(1);render(2);message(!n?"画像をタップして選択してください":cutMode?`画像${n}：消したい部分を指で囲んでください`:`画像${n}：1本指で移動、2本指で拡大縮小・回転`) }
function local(e){const r=stage.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function metrics(L){const k=Math.min(stage.clientWidth/L.canvas.width,stage.clientHeight/L.canvas.height);return{k,w:L.canvas.width*k,h:L.canvas.height*k}}
function sourcePoint(n,p){const L=layers[n],b=metrics(L),a=-L.rotate*Math.PI/180,dx=p.x-(stage.clientWidth/2+L.x),dy=p.y-(stage.clientHeight/2+L.y),rx=(dx*Math.cos(a)-dy*Math.sin(a))/(L.scale/100),ry=(dx*Math.sin(a)+dy*Math.cos(a))/(L.scale/100);return{x:(rx+b.w/2)/b.k,y:(ry+b.h/2)/b.k}}
function hit(n,p){const L=layers[n];if(!L.canvas)return false;const q=sourcePoint(n,p);return q.x>=0&&q.y>=0&&q.x<=L.canvas.width&&q.y<=L.canvas.height}
function topHit(p){return hit(2,p)?2:hit(1,p)?1:0}
function drawTrace(){trace.width=stage.clientWidth;trace.height=stage.clientHeight;if(points.length<2)return;tc.strokeStyle="#ffffff";tc.lineWidth=2;tc.setLineDash([6,4]);tc.beginPath();tc.moveTo(points[0].x,points[0].y);points.slice(1).forEach(p=>tc.lineTo(p.x,p.y));tc.stroke();tc.setLineDash([])}
function eraseInside(){if(!selected||points.length<3)return;const L=layers[selected],c=document.createElement("canvas"),ctx=c.getContext("2d");c.width=L.canvas.width;c.height=L.canvas.height;ctx.drawImage(L.canvas,0,0);const p=points.map(q=>sourcePoint(selected,q));ctx.beginPath();ctx.moveTo(p[0].x,p[0].y);p.slice(1).forEach(q=>ctx.lineTo(q.x,q.y));ctx.closePath();ctx.globalCompositeOperation="destination-out";ctx.fill();L.canvas=c;points=[];drawTrace();render(selected,true);message(`画像${selected}の囲んだ部分を消しました`)}
function pair(){const p=[...pointers.values()];if(p.length!==2)return null;const dx=p[1].x-p[0].x,dy=p[1].y-p[0].y;return{distance:Math.hypot(dx,dy),angle:Math.atan2(dy,dx)}}
stage.addEventListener("pointerdown",e=>{if(e.target.closest(".top"))return;stage.setPointerCapture(e.pointerId);const p=local(e);pointers.set(e.pointerId,p);if(pointers.size===2){points=[];drawTrace();const q=pair();if(selected&&q)gesture={kind:"pinch",distance:q.distance,angle:q.angle,scale:layers[selected].scale,rotate:layers[selected].rotate};return}const n=topHit(p),now=Date.now();if(n&&n===lastTap.layer&&now-lastTap.time<320){lastTap={time:0,layer:0};select(0);gesture=null;return}lastTap={time:now,layer:n};if(!n){select(0);gesture=null;return}select(n);gesture=cutMode?{kind:"cut"}:{kind:"drag",id:e.pointerId,start:p,x:layers[n].x,y:layers[n].y};if(cutMode)points=[p]});
stage.addEventListener("pointermove",e=>{if(!pointers.has(e.pointerId))return;const p=local(e);pointers.set(e.pointerId,p);if(pointers.size===2&&selected){const q=pair();if(gesture?.kind!=="pinch"&&q)gesture={kind:"pinch",distance:q.distance,angle:q.angle,scale:layers[selected].scale,rotate:layers[selected].rotate};if(q&&gesture?.kind==="pinch"){const L=layers[selected];L.scale=Math.max(10,Math.min(300,gesture.scale*q.distance/gesture.distance));L.rotate=gesture.rotate+(q.angle-gesture.angle)*180/Math.PI;render(selected)}return}if(!selected)return;if(gesture?.kind==="cut"){points.push(p);drawTrace()}else if(gesture?.kind==="drag"&&gesture.id===e.pointerId){const L=layers[selected];L.x=gesture.x+p.x-gesture.start.x;L.y=gesture.y+p.y-gesture.start.y;render(selected)}});
function endPointer(e){const shouldCut=gesture?.kind==="cut"&&pointers.size===1&&points.length>2;pointers.delete(e.pointerId);if(shouldCut)eraseInside();if(pointers.size<2)gesture=null}stage.addEventListener("pointerup",endPointer);stage.addEventListener("pointercancel",endPointer);
[1,2].forEach(n=>$("tab"+n).onclick=()=>select(n));
$("add").onclick=()=>{$("picker").click()};$("picker").onchange=e=>{const file=e.target.files[0];if(!file)return;const n=selected||1,L=layers[n];if(L.url)URL.revokeObjectURL(L.url);L.url=URL.createObjectURL(file);const im=new Image();im.onload=()=>{L.original=canvasFromImage(im);L.canvas=canvasFromImage(im);L.scale=100;L.rotate=0;L.opacity=100;L.x=0;L.y=0;render(n,true);select(n)};im.src=L.url;e.target.value=""};
$("adjust").onclick=()=>{if(!selected){message("先に画像を選択してください");return}const L=layers[selected];$("scale").value=L.scale;$("rotate").value=L.rotate;$("opacity").value=L.opacity;$("scaleOut").value=(L.scale/100).toFixed(2)+" 倍";$("rotateOut").value=L.rotate+"°";$("opacityOut").value=L.opacity+"%";$("sheetTitle").textContent=`画像${selected}を調整`;$("sheet").classList.add("open")};$("close").onclick=()=>$("sheet").classList.remove("open");
[["scale","scale","scaleOut",v=>(v/100).toFixed(2)+" 倍"],["rotate","rotate","rotateOut",v=>v+"°"],["opacity","opacity","opacityOut",v=>v+"%"]].forEach(([id,key,out,format])=>$(id).oninput=e=>{if(!selected)return;layers[selected][key]=Number(e.target.value);$(out).value=format(Number(e.target.value));render(selected)});
$("cut").onclick=()=>{if(!selected){message("先に画像を選択してください");return}cutMode=!cutMode;$("cut").classList.toggle("mode",cutMode);select(selected)};$("restore").onclick=()=>{if(!selected||!layers[selected].original)return;const L=layers[selected],c=document.createElement("canvas");c.width=L.original.width;c.height=L.original.height;c.getContext("2d").drawImage(L.original,0,0);L.canvas=c;render(selected,true);message(`画像${selected}のカットを元に戻しました`)};
$("save").onclick=async()=>{if(!layers[1].canvas&&!layers[2].canvas){message("先に画像を読み込んでください");return}const c=document.createElement("canvas"),ctx=c.getContext("2d");c.width=c.height=2000;ctx.fillStyle="#090b10";ctx.fillRect(0,0,2000,2000);[1,2].forEach(n=>{const L=layers[n];if(!L.canvas)return;const k=Math.min(2000/L.canvas.width,2000/L.canvas.height)*L.scale/100,w=L.canvas.width*k,h=L.canvas.height*k,ratio=2000/stage.clientWidth;ctx.save();ctx.translate(1000+L.x*ratio,1000+L.y*ratio);ctx.rotate(L.rotate*Math.PI/180);ctx.globalAlpha=L.opacity/100;ctx.drawImage(L.canvas,-w/2,-h/2,w,h);ctx.restore()});const blob=await new Promise(r=>c.toBlob(r,"image/png")),file=new File([blob],"two-image-"+Date.now()+".png",{type:"image/png"});try{if(navigator.share&&navigator.canShare?.({files:[file]}))await navigator.share({files:[file],title:"合成画像"});else{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=file.name;a.click()}}catch(_){}};
if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js");render(1);render(2);select(0);
</script></body></html>
