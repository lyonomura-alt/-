<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10131a"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>2画像調整</title><style>:root{--bg:#10131a;--card:#1b202b;--line:#364154;--blue:#3d91ff;--sub:#b6c0d0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f7f9fc;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;-webkit-tap-highlight-color:transparent}main{max-width:700px;margin:auto;padding:calc(14px + env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom))}h1{font-size:22px;margin:3px 0 5px}.lead{font-size:13px;color:var(--sub);margin:0 0 14px}#stage{position:relative;width:100%;aspect-ratio:1;border:1px solid var(--line);border-radius:18px;overflow:hidden;touch-action:none;background:#090b10;background-image:linear-gradient(45deg,#151a25 25%,transparent 25%),linear-gradient(-45deg,#151a25 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#151a25 75%),linear-gradient(-45deg,transparent 75%,#151a25 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}.layer{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform-origin:center;pointer-events:none}.selected{filter:drop-shadow(0 0 3px #fff) drop-shadow(0 0 7px #3d91ff)}#lasso{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#8c98a9;font-size:15px;line-height:1.6;pointer-events:none}.guide{position:absolute;left:10px;right:10px;bottom:10px;padding:7px 10px;border-radius:8px;background:#000a;color:#dce9ff;text-align:center;font-size:12px;pointer-events:none}.panel{margin-top:14px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:16px}.panel h2{font-size:17px;margin:0 0 12px}.pick,button{min-height:44px;border:0;border-radius:11px;font:inherit;font-weight:700}.pick{display:flex;align-items:center;justify-content:center;width:100%;color:white;background:var(--blue)}input[type=file]{display:none}.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:13px}.modes button{color:#dbe8fa;background:#333d50}.modes button.active{color:#fff;background:#276fc2;outline:2px solid #8fc2ff}.row{margin-top:14px}.label{display:flex;justify-content:space-between;margin-bottom:5px;font-size:14px}output{color:var(--sub);font-variant-numeric:tabular-nums}input[type=range]{display:block;width:100%;min-height:34px;accent-color:var(--blue)}.small{margin-top:9px;margin-right:6px;padding:0 12px;color:#dbe8fa;background:#333d50}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.actions button{padding:0 8px;color:#fff;background:#276fc2}.actions button+button{background:#333d50}#notice{min-height:22px;margin:12px 2px 0;text-align:center;color:#c4d9f7;font-size:13px}</style></head><body><main><h1>2画像調整</h1><p class="lead">画像をタップして選択。1本指で移動、2本指で拡大縮小・回転できます。</p><div id="stage"><div id="empty" class="empty">下のボタンから<br>画像を読み込んでください</div><img id="image1" class="layer" alt=""><img id="image2" class="layer" alt=""><canvas id="lasso"></canvas><div id="guide" class="guide">画像をタップして選択してください</div></div><section class="panel"><h2>操作モード</h2><div class="modes"><button id="moveMode" class="active">移動・変形</button><button id="cropMode">切り取り</button></div><p class="lead">切り取り：選択画像を指で囲むようになぞり、指を離すと内側だけ残ります。</p></section><section class="panel"><h2>画像 1</h2><label class="pick" for="file1">画像1を選択</label><input id="file1" type="file" accept="image/*"><div class="row"><div class="label"><span>拡大縮小</span><output id="scale1out"></output></div><input id="scale1" type="range" min="10" max="300" value="100"></div><div class="row"><div class="label"><span>回転</span><output id="rotate1out"></output></div><input id="rotate1" type="range" min="-180" max="180" value="0"></div><div class="row"><div class="label"><span>透明度</span><output id="opacity1out"></output></div><input id="opacity1" type="range" min="0" max="100" value="100"></div><button class="small reset" data-n="1">調整をリセット</button><button class="small restore" data-n="1">切り取りを元に戻す</button></section><section class="panel"><h2>画像 2</h2><label class="pick" for="file2">画像2を選択</label><input id="file2" type="file" accept="image/*"><div class="row"><div class="label"><span>拡大縮小</span><output id="scale2out"></output></div><input id="scale2" type="range" min="10" max="300" value="100"></div><div class="row"><div class="label"><span>回転</span><output id="rotate2out"></output></div><input id="rotate2" type="range" min="-180" max="180" value="0"></div><div class="row"><div class="label"><span>透明度</span><output id="opacity2out"></output></div><input id="opacity2" type="range" min="0" max="100" value="100"></div><button class="small reset" data-n="2">調整をリセット</button><button class="small restore" data-n="2">切り取りを元に戻す</button></section><div class="actions"><button id="save">合成画像を保存</button><button id="clear">すべて消去</button></div><div id="notice" role="status"></div></main><script>const $=id=>document.getElementById(id),stage=$('stage'),lasso=$('lasso'),lc=lasso.getContext('2d'),S={1:{original:null,im:null,url:null,scale:100,rotate:0,opacity:100,x:0,y:0},2:{original:null,im:null,url:null,scale:100,rotate:0,opacity:100,x:0,y:0}};let active=null,mode='move',points=[],pointers=new Map(),gesture=null;
function base(s){const w=stage.clientWidth,h=stage.clientHeight,k=Math.min(w/s.im.naturalWidth,h/s.im.naturalHeight);return{w:s.im.naturalWidth*k,h:s.im.naturalHeight*k,k}}
function render(n){const s=S[n],p=$('image'+n);if(s.im)p.src=s.im instanceof HTMLCanvasElement?s.im.toDataURL():s.url;p.style.transform=`translate(${s.x}px,${s.y}px) scale(${s.scale/100}) rotate(${s.rotate}deg)`;p.style.opacity=s.opacity/100;p.classList.toggle('selected',active===n);$('scale'+n).value=s.scale;$('rotate'+n).value=s.rotate;$('opacity'+n).value=s.opacity;$('scale'+n+'out').value=(s.scale/100).toFixed(2)+' 倍';$('rotate'+n+'out').value=s.rotate+'°';$('opacity'+n+'out').value=s.opacity+'%';$('empty').style.display=(S[1].im||S[2].im)?'none':'grid'}
function setActive(n){active=n;[1,2].forEach(render);$('guide').textContent=n?(mode==='crop'?`画像${n}を切り取り中：指で囲んでください`:`画像${n}を選択中：1本指で移動、2本指で変形`):'画像をタップして選択してください'}
function stagePoint(e){const r=stage.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function sourcePoint(n,p){const s=S[n],b=base(s),cx=stage.clientWidth/2+s.x,cy=stage.clientHeight/2+s.y,a=-s.rotate*Math.PI/180,dx=p.x-cx,dy=p.y-cy,rx=(dx*Math.cos(a)-dy*Math.sin(a))/(s.scale/100),ry=(dx*Math.sin(a)+dy*Math.cos(a))/(s.scale/100);return{x:(rx+b.w/2)/b.k,y:(ry+b.h/2)/b.k}}
function hit(n,p){const s=S[n];if(!s.im)return false;const q=sourcePoint(n,p);return q.x>=0&&q.x<=s.im.naturalWidth&&q.y>=0&&q.y<=s.im.naturalHeight}
function hitTop(p){return hit(2,p)?2:hit(1,p)?1:null}
function drawPath(){lasso.width=stage.clientWidth;lasso.height=stage.clientHeight;if(points.length<2)return;lc.strokeStyle='#fff';lc.lineWidth=2;lc.setLineDash([5,4]);lc.beginPath();lc.moveTo(points[0].x,points[0].y);points.slice(1).forEach(p=>lc.lineTo(p.x,p.y));lc.stroke();lc.setLineDash([])}
function crop(){if(!active||points.length<3)return;const s=S[active],c=document.createElement('canvas'),ctx=c.getContext('2d');c.width=s.original.naturalWidth;c.height=s.original.naturalHeight;const sp=points.map(p=>sourcePoint(active,p));ctx.beginPath();ctx.moveTo(sp[0].x,sp[0].y);sp.slice(1).forEach(p=>ctx.lineTo(p.x,p.y));ctx.closePath();ctx.clip();ctx.drawImage(s.im,0,0,s.im.naturalWidth,s.im.naturalHeight);s.im=c;points=[];drawPath();render(active);$('notice').textContent=`画像${active}を切り取りました。`}
function two(){const a=[...pointers.values()];if(a.length!==2)return null;const dx=a[1].x-a[0].x,dy=a[1].y-a[0].y;return{d:Math.hypot(dx,dy),a:Math.atan2(dy,dx)}}
function beginGesture(){if(!active)return;const t=two();if(t)gesture={...t,scale:S[active].scale,rotate:S[active].rotate}}
['moveMode','cropMode'].forEach(id=>$(id).onclick=()=>{mode=id==='cropMode'?'crop':'move';$('moveMode').classList.toggle('active',mode==='move');$('cropMode').classList.toggle('active',mode==='crop');setActive(active)});
stage.addEventListener('pointerdown',e=>{stage.setPointerCapture(e.pointerId);const p=stagePoint(e);pointers.set(e.pointerId,p);if(pointers.size===2){points=[];drawPath();beginGesture();return}const n=hitTop(p);if(!n){setActive(null);return}if(n!==active)setActive(n);if(mode==='crop')points=[p];else gesture={drag:true,id:e.pointerId,x:S[active].x,y:S[active].y,p};});stage.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const p=stagePoint(e);pointers.set(e.pointerId,p);if(pointers.size===2&&active){const t=two();if(!gesture||!gesture.d)beginGesture();if(gesture&&t){S[active].scale=Math.max(10,Math.min(300,gesture.scale*t.d/gesture.d));S[active].rotate=gesture.rotate+(t.a-gesture.a)*180/Math.PI;render(active)}return}if(!active)return;if(mode==='crop'&&points.length){points.push(p);drawPath()}else if(gesture&&gesture.drag&&gesture.id===e.pointerId){S[active].x=gesture.x+p.x-gesture.p.x;S[active].y=gesture.y+p.y-gesture.p.y;render(active)}});function end(e){const wasCrop=mode==='crop'&&pointers.size===1&&points.length>2;pointers.delete(e.pointerId);if(wasCrop)crop();if(pointers.size<2)gesture=null}stage.addEventListener('pointerup',end);stage.addEventListener('pointercancel',end);
[1,2].forEach(n=>{['scale','rotate','opacity'].forEach(k=>$(k+n).oninput=e=>{S[n][k]=+e.target.value;render(n)});$('file'+n).onchange=e=>{const f=e.target.files[0];if(!f)return;if(S[n].url)URL.revokeObjectURL(S[n].url);const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{Object.assign(S[n],{original:im,im,url:u,scale:100,rotate:0,opacity:100,x:0,y:0});$('image'+n).src=u;setActive(n)};im.src=u}});document.querySelectorAll('.reset').forEach(b=>b.onclick=()=>{const s=S[b.dataset.n];Object.assign(s,{scale:100,rotate:0,opacity:100,x:0,y:0});render(b.dataset.n)});document.querySelectorAll('.restore').forEach(b=>b.onclick=()=>{const s=S[b.dataset.n];if(s.original){s.im=s.original;render(b.dataset.n);$('notice').textContent=`画像${b.dataset.n}の切り取りを元に戻しました。`}});$('clear').onclick=()=>{[1,2].forEach(n=>{if(S[n].url)URL.revokeObjectURL(S[n].url);Object.assign(S[n],{original:null,im:null,url:null,scale:100,rotate:0,opacity:100,x:0,y:0});$('image'+n).removeAttribute('src');$('file'+n).value='';render(n)});setActive(null)};$('save').onclick=async()=>{if(!S[1].im&&!S[2].im){$('notice').textContent='先に画像を選択してください。';return}const ratio=2000/stage.clientWidth,c=document.createElement('canvas');c.width=c.height=2000;const x=c.getContext('2d');x.fillStyle='#090b10';x.fillRect(0,0,2000,2000);[1,2].forEach(n=>{const s=S[n];if(!s.im)return;const z=Math.min(2000/s.im.naturalWidth,2000/s.im.naturalHeight)*s.scale/100,w=s.im.naturalWidth*z,h=s.im.naturalHeight*z;x.save();x.translate(1000+s.x*ratio,1000+s.y*ratio);x.rotate(s.rotate*Math.PI/180);x.globalAlpha=s.opacity/100;x.drawImage(s.im,-w/2,-h/2,w,h);x.restore()});const blob=await new Promise(r=>c.toBlob(r,'image/png')),f=new File([blob],'two-image-'+Date.now()+'.png',{type:'image/png'});try{if(navigator.share&&navigator.canShare?.({files:[f]})){await navigator.share({files:[f],title:'合成画像'});$('notice').textContent='共有画面で「画像を保存」を選んでください。'}else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=f.name;a.click()}}catch(_){$('notice').textContent='保存をキャンセルしました。'}};if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));[1,2].forEach(render);setActive(null);</script></body></html>
