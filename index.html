<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10131a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>2画像調整</title>
<style>
:root{--bg:#10131a;--card:#1b202b;--line:#364154;--blue:#3d91ff;--sub:#b6c0d0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f7f9fc;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;-webkit-tap-highlight-color:transparent}main{max-width:700px;margin:auto;padding:calc(14px + env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom))}h1{font-size:22px;margin:3px 0 5px}.lead{font-size:13px;color:var(--sub);margin:0 0 14px}#stage{position:relative;width:100%;aspect-ratio:1;border:1px solid var(--line);border-radius:18px;overflow:hidden;touch-action:none;background-color:#090b10;background-image:linear-gradient(45deg,#151a25 25%,transparent 25%),linear-gradient(-45deg,#151a25 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#151a25 75%),linear-gradient(-45deg,transparent 75%,#151a25 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}.layer{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform-origin:center;pointer-events:none}.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#8c98a9;font-size:15px;line-height:1.6;pointer-events:none}.move-guide{position:absolute;left:10px;right:10px;bottom:10px;padding:7px 10px;border-radius:8px;background:#0009;color:#dce9ff;text-align:center;font-size:12px;pointer-events:none}.panel{margin-top:14px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:16px}.panel h2{font-size:17px;margin:0 0 12px}.pick,button{min-height:44px;border:0;border-radius:11px;font:inherit;font-weight:700}.pick{display:flex;align-items:center;justify-content:center;width:100%;color:white;background:var(--blue)}input[type=file]{display:none}.target{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 13px}.target button{color:#dbe8fa;background:#333d50}.target button.active{color:#fff;background:#276fc2;outline:2px solid #8fc2ff}.row{margin-top:14px}.label{display:flex;justify-content:space-between;margin-bottom:5px;font-size:14px}output{color:var(--sub);font-variant-numeric:tabular-nums}input[type=range]{display:block;width:100%;min-height:34px;accent-color:var(--blue)}.reset{margin-top:9px;padding:0 13px;color:#dbe8fa;background:#333d50}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.actions button{padding:0 8px;color:#fff;background:#276fc2}.actions button+button{background:#333d50}#notice{min-height:22px;margin:12px 2px 0;text-align:center;color:#c4d9f7;font-size:13px}
</style>
</head>
<body><main>
<h1>2画像調整</h1><p class="lead">画像を2枚重ね、個別に調整・移動できます。</p>
<div id="stage"><div id="empty" class="empty">下のボタンから<br>画像を読み込んでください</div><img id="image1" class="layer" alt=""><img id="image2" class="layer" alt=""><div id="moveGuide" class="move-guide">画像1を移動中：この枠内を指でドラッグ</div></div>
<section class="panel"><h2>移動する画像を選ぶ</h2><div class="target"><button id="target1" class="active">画像1を移動</button><button id="target2">画像2を移動</button></div><p class="lead">選択後、上のプレビュー枠内を指でドラッグしてください。</p></section>
<section class="panel"><h2>画像 1</h2><label class="pick" for="file1">画像1を選択</label><input id="file1" type="file" accept="image/*"><div class="row"><div class="label"><span>拡大縮小</span><output id="scale1out"></output></div><input id="scale1" type="range" min="10" max="300" value="100"></div><div class="row"><div class="label"><span>回転</span><output id="rotate1out"></output></div><input id="rotate1" type="range" min="-180" max="180" value="0"></div><div class="row"><div class="label"><span>透明度</span><output id="opacity1out"></output></div><input id="opacity1" type="range" min="0" max="100" value="100"></div><button class="reset" data-n="1">画像1をリセット</button></section>
<section class="panel"><h2>画像 2</h2><label class="pick" for="file2">画像2を選択</label><input id="file2" type="file" accept="image/*"><div class="row"><div class="label"><span>拡大縮小</span><output id="scale2out"></output></div><input id="scale2" type="range" min="10" max="300" value="100"></div><div class="row"><div class="label"><span>回転</span><output id="rotate2out"></output></div><input id="rotate2" type="range" min="-180" max="180" value="0"></div><div class="row"><div class="label"><span>透明度</span><output id="opacity2out"></output></div><input id="opacity2" type="range" min="0" max="100" value="100"></div><button class="reset" data-n="2">画像2をリセット</button></section>
<div class="actions"><button id="save">合成画像を保存</button><button id="clear">すべて消去</button></div><div id="notice" role="status"></div>
</main><script>
const $=id=>document.getElementById(id),S={1:{im:null,url:null,scale:100,rotate:0,opacity:100,x:0,y:0},2:{im:null,url:null,scale:100,rotate:0,opacity:100,x:0,y:0}};let active=1,drag=null;
function render(n){const s=S[n],p=$('image'+n);p.style.transform=`translate(${s.x}px,${s.y}px) scale(${s.scale/100}) rotate(${s.rotate}deg)`;p.style.opacity=s.opacity/100;$('scale'+n).value=s.scale;$('rotate'+n).value=s.rotate;$('opacity'+n).value=s.opacity;$('scale'+n+'out').value=(s.scale/100).toFixed(2)+' 倍';$('rotate'+n+'out').value=s.rotate+'°';$('opacity'+n+'out').value=s.opacity+'%';$('empty').style.display=(S[1].im||S[2].im)?'none':'grid'}
function selectTarget(n){active=n;$('target1').classList.toggle('active',n===1);$('target2').classList.toggle('active',n===2);$('moveGuide').textContent=`画像${n}を移動中：この枠内を指でドラッグ`}
[1,2].forEach(n=>{['scale','rotate','opacity'].forEach(k=>$(k+n).addEventListener('input',e=>{S[n][k]=+e.target.value;render(n)}));$('file'+n).addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;if(S[n].url)URL.revokeObjectURL(S[n].url);const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{S[n].im=im;S[n].url=u;$('image'+n).src=u;render(n)};im.src=u});$('target'+n).onclick=()=>selectTarget(n)});
$('stage').addEventListener('pointerdown',e=>{if(!S[active].im)return;drag={id:e.pointerId,startX:e.clientX,startY:e.clientY,x:S[active].x,y:S[active].y};e.currentTarget.setPointerCapture(e.pointerId)});$('stage').addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;S[active].x=drag.x+e.clientX-drag.startX;S[active].y=drag.y+e.clientY-drag.startY;render(active)});function endDrag(e){if(drag&&e.pointerId===drag.id)drag=null}$('stage').addEventListener('pointerup',endDrag);$('stage').addEventListener('pointercancel',endDrag);
document.querySelectorAll('.reset').forEach(b=>b.onclick=()=>{const n=b.dataset.n;Object.assign(S[n],{scale:100,rotate:0,opacity:100,x:0,y:0});render(n)});$('clear').onclick=()=>{[1,2].forEach(n=>{if(S[n].url)URL.revokeObjectURL(S[n].url);Object.assign(S[n],{im:null,url:null,scale:100,rotate:0,opacity:100,x:0,y:0});$('image'+n).removeAttribute('src');$('file'+n).value='';render(n)});$('notice').textContent='画像を消去しました。'};
$('save').onclick=async()=>{if(!S[1].im&&!S[2].im){$('notice').textContent='先に画像を1枚以上選択してください。';return}const stage=$('stage'),ratio=2000/stage.clientWidth,c=document.createElement('canvas');c.width=c.height=2000;const x=c.getContext('2d');x.fillStyle='#090b10';x.fillRect(0,0,2000,2000);[1,2].forEach(n=>{const s=S[n],im=s.im;if(!im)return;const z=Math.min(2000/im.naturalWidth,2000/im.naturalHeight)*s.scale/100,w=im.naturalWidth*z,h=im.naturalHeight*z;x.save();x.translate(1000+s.x*ratio,1000+s.y*ratio);x.rotate(s.rotate*Math.PI/180);x.globalAlpha=s.opacity/100;x.drawImage(im,-w/2,-h/2,w,h);x.restore()});const blob=await new Promise(r=>c.toBlob(r,'image/png')),file=new File([blob],'two-image-'+Date.now()+'.png',{type:'image/png'});try{if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'合成画像'});$('notice').textContent='共有画面で「画像を保存」を選んでください。'}else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;a.click();$('notice').textContent='画像をダウンロードしました。'}}catch(e){$('notice').textContent='保存をキャンセルしました。'}};
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));[1,2].forEach(render);selectTarget(1);
</script></body></html>
